name: CardNews Auto Upload - TR

on:
  schedule:
    - cron: '0 6 * * *'    # 15:00 KST
    - cron: '3 6 * * *'    # 15:03 KST
    - cron: '6 6 * * *'    # 15:06 KST
    - cron: '9 6 * * *'    # 15:09 KST
    - cron: '12 6 * * *'   # 15:12 KST
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 설정 파일 생성
        env:
          CONFIG_B64: ${{ secrets.CARDNEWS_CONFIG }}
        run: echo "$CONFIG_B64" | tr -d '[:space:]' | base64 -d > cardnews_config.py

      - name: 업로드 실행
        run: python cardnews_upload.py tr
